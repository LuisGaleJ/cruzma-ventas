# Integración continua: en cada push o pull request GitHub compila el proyecto y ejecuta las pruebas.
# El resultado (check verde o rojo) queda como evidencia en la pestaña "Actions" del repositorio.
name: Compilar y probar

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B verify
      - name: Generar Javadoc
        run: mvn -B javadoc:javadoc
