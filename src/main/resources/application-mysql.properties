# Perfil mysql: usa la base creada con db/schema.sql
# La contrasena NO va aqui: se lee de la variable de entorno DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cruzma_ventas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:cruzma_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none