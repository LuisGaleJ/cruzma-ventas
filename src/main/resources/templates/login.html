<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<div class="login">
    <form th:action="@{/login}" method="post">
        <h1>Grupo Cruzma</h1>
        <p class="text-secondary">Ingresa con tu usuario para cotizar, vender y facturar.</p>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">Usuario o contraseña incorrectos, o el usuario está desactivado o bloqueado. Tras 5 intentos fallidos el acceso se bloquea 15 minutos.</div>
        <div th:if="${param.salir}" class="alert alert-success" role="status">Cerraste sesión.</div>
        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input id="username" name="username" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-principal w-100">Ingresar</button>
    </form>
</div>
</body>
</html>
