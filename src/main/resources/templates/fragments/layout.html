<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Cruzma Ventas'">Cruzma Ventas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/cruzma.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="menu" class="menu" aria-label="Módulos">
    <div class="marca">Grupo Cruzma<small>Ventas y facturación</small></div>
    <a th:href="@{/}" th:classappend="${uri == '/'} ? 'activo'">Panel</a>
    <a sec:authorize="hasAnyRole('ADMIN','VENDEDOR')" th:href="@{/cotizaciones}"
       th:classappend="${#strings.startsWith(uri, '/cotizaciones')} ? 'activo'">Cotizaciones</a>
    <a th:href="@{/ventas}" th:classappend="${#strings.startsWith(uri, '/ventas')} ? 'activo'">Ventas y cobros</a>
    <a th:href="@{/comprobantes}" th:classappend="${#strings.startsWith(uri, '/comprobantes')} ? 'activo'">Comprobantes</a>
    <a th:href="@{/clientes}" th:classappend="${#strings.startsWith(uri, '/clientes')} ? 'activo'">Clientes</a>
    <a th:href="@{/productos}" th:classappend="${#strings.startsWith(uri, '/productos')} ? 'activo'">Productos y servicios</a>
    <a th:href="@{/reportes}" th:classappend="${#strings.startsWith(uri, '/reportes')} ? 'activo'">Reportes</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}"
       th:classappend="${#strings.startsWith(uri, '/usuarios')} ? 'activo'">Usuarios</a>
    <div class="usuario">
        <div sec:authentication="name">usuario</div>
        <form th:action="@{/logout}" method="post"><button type="submit">Cerrar sesión</button></form>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

</body>
</html>
