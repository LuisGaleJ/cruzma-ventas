<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Cruzma Ventas'">Cruzma Ventas</title>
    <!-- PWA: se puede instalar en el celular como una app (manifest + service worker en /js/app.js) -->
    <link rel="manifest" th:href="@{/manifest.json}">
    <meta name="theme-color" content="#1f272e">
    <link rel="icon" type="image/png" th:href="@{/img/favicon-32.png}">
    <link rel="apple-touch-icon" th:href="@{/img/apple-touch-icon.png}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cruzma">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@3.0.3/css/responsive.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-buttons-bs5@3.1.2/css/buttons.bootstrap5.min.css" rel="stylesheet">
    <link th:href="@{/css/cruzma.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- DataTables: búsqueda, orden y paginación de tablas (usa jQuery). Mismo CDN que Bootstrap. -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.1.8/js/dataTables.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@2.1.8/js/dataTables.bootstrap5.min.js" defer></script>
    <!-- DataTables Responsive: en el celular oculta columnas secundarias y las muestra al tocar la fila -->
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive@3.0.3/js/dataTables.responsive.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive-bs5@3.0.3/js/responsive.bootstrap5.min.js" defer></script>
    <!-- DataTables Buttons: exportar la tabla a Excel (con JSZip), CSV o imprimirla -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-buttons@3.1.2/js/dataTables.buttons.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-buttons-bs5@3.1.2/js/buttons.bootstrap5.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-buttons@3.1.2/js/buttons.html5.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-buttons@3.1.2/js/buttons.print.min.js" defer></script>
    <script th:src="@{/js/tablas.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<nav th:fragment="menu" class="menu" id="menu" aria-label="Módulos">
    <div class="menu-barra">
        <div class="marca">Grupo Cruzma<small>Ventas y facturación</small></div>
        <!-- Botón hamburguesa: solo se ve en celulares y tablets (ver cruzma.css) -->
        <button type="button" class="menu-boton" aria-controls="menuEnlaces" aria-expanded="false" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
                <path class="icono-abrir" d="M3 6h18M3 12h18M3 18h18"/>
                <path class="icono-cerrar" d="M6 6l12 12M18 6L6 18"/>
            </svg>
        </button>
    </div>
    <div class="menu-enlaces" id="menuEnlaces">
    <a th:href="@{/}" th:classappend="${uri == '/'} ? 'activo'">Panel</a>
    <a sec:authorize="hasAnyRole('ADMIN','VENDEDOR')" th:href="@{/cotizaciones}"
       th:classappend="${#strings.startsWith(uri, '/cotizaciones')} ? 'activo'">Cotizaciones</a>
    <a th:href="@{/ventas}" th:classappend="${#strings.startsWith(uri, '/ventas')} ? 'activo'">Ventas y cobros</a>
    <a th:href="@{/comprobantes}" th:classappend="${#strings.startsWith(uri, '/comprobantes')} ? 'activo'">Comprobantes</a>
    <a th:href="@{/clientes}" th:classappend="${#strings.startsWith(uri, '/clientes')} ? 'activo'">Clientes</a>
    <a th:href="@{/productos}" th:classappend="${#strings.startsWith(uri, '/productos')} ? 'activo'">Productos y servicios</a>
    <a th:href="@{/reportes}" th:classappend="${#strings.startsWith(uri, '/reportes')} ? 'activo'">Reportes</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}"
       th:classappend="${#strings.startsWith(uri, '/usuarios')} ? 'activo'">Usuarios</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/auditoria}"
       th:classappend="${#strings.startsWith(uri, '/auditoria')} ? 'activo'">Historial de cambios</a>
    <div class="usuario">
        <div sec:authentication="name">usuario</div>
        <form th:action="@{/logout}" method="post"><button type="submit">Cerrar sesión</button></form>
    </div>
    </div>
</nav>

<div th:fragment="mensajes">
    <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
</div>

</body>
</html>
