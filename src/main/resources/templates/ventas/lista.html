<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Ventas y cobros')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="encabezado"><div><h1>Ventas y cobros</h1><p>Las ventas se crean al convertir una cotización aceptada.</p></div></div>
        <section class="hoja">
            <p th:if="${#lists.isEmpty(ventas)}" class="text-secondary m-0">Aún no hay ventas.</p>
            <table th:unless="${#lists.isEmpty(ventas)}" class="table">
                <thead><tr><th>N.º</th><th>Fecha</th><th>Cliente</th><th class="num">Total S/</th><th class="num">Saldo S/</th><th>Estado</th></tr></thead>
                <tbody>
                <tr th:each="v : ${ventas}">
                    <td><a th:href="@{/ventas/{id}(id=${v.id})}" th:text="${v.id}">1</a></td>
                    <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
                    <td th:text="${v.cliente.razonSocial}">cliente</td>
                    <td class="num" th:text="${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">0</td>
                    <td class="num" th:text="${#numbers.formatDecimal(v.saldo, 1, 'COMMA', 2, 'POINT')}">0</td>
                    <td><span class="estado" th:classappend="'estado-' + ${v.estado}" th:text="${v.estado}">estado</span></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
