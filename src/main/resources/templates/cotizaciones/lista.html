<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Cotizaciones')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="encabezado">
            <div><h1>Cotizaciones</h1><p>Cada cotización es válida por 15 días. En amarillo, las que vencen en los próximos <span th:text="${diasAviso}">3</span> días.</p></div>
            <a th:href="@{/cotizaciones/nueva}" class="btn btn-principal">Nueva cotización</a>
        </div>
        <section class="hoja">
            <p th:if="${#lists.isEmpty(cotizaciones)}" class="text-secondary m-0">No hay cotizaciones. Crea la primera con el botón Nueva cotización.</p>
            <table th:unless="${#lists.isEmpty(cotizaciones)}" class="table" id="tablaCotizaciones">
                <thead><tr><th data-priority="2">Número</th><th data-priority="5">Fecha</th><th data-priority="1">Cliente</th><th data-priority="6">Vence</th><th data-priority="3" class="num">Total S/</th><th data-priority="4">Estado</th></tr></thead>
                <tbody>
                <tr th:each="c : ${cotizaciones}"
                    th:classappend="${c.porVencer(diasAviso)} ? 'fila-por-vencer' : (${c.estado.name() == 'VENCIDA'} ? 'fila-vencida' : '')">
                    <td><a th:href="@{/cotizaciones/{id}(id=${c.id})}" th:text="${c.numero}">num</a></td>
                    <td th:data-order="${#temporals.format(c.fecha, 'yyyy-MM-dd')} + '-' + ${c.numero}" th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}">fecha</td>
                    <td th:text="${c.cliente.razonSocial}">cliente</td>
                    <td th:data-order="${#temporals.format(c.fechaVencimiento, 'yyyy-MM-dd')}" th:text="${#temporals.format(c.fechaVencimiento, 'dd/MM/yyyy')}">vence</td>
                    <td class="num" th:data-order="${c.total}" th:text="${#numbers.formatDecimal(c.total, 1, 'COMMA', 2, 'POINT')}">0</td>
                    <td><span class="estado" th:classappend="'estado-' + ${c.estado}" th:text="${c.estado}">estado</span>
                        <small th:if="${c.estado.name() == 'PENDIENTE'}" class="d-block aviso-vence"
                               th:classappend="${c.porVencer(diasAviso)} ? 'urgente'" th:text="${c.textoVencimiento}">vence en 3 días</small></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
<script th:inline="none">
    // Búsqueda, orden y exportación (Excel, CSV, Imprimir); primero las cotizaciones más recientes
    document.addEventListener('DOMContentLoaded', function () {
        cruzmaTabla('#tablaCotizaciones', { order: [ [1, 'desc'] ] });
    });
</script>
</body>
</html>
