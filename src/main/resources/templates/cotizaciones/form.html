<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Nueva cotización')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="encabezado">
            <div><h1>Nueva cotización</h1>
                <p th:text="'Válida por ' + ${diasValidez} + ' días. Puedes aplicar descuento por ítem y un descuento global de hasta '
                        + ${descuentoMaximo} + ' % (máximo de tu rol).'">Válida</p></div>
        </div>
        <form th:action="@{/cotizaciones}" method="post" id="formCotizacion" th:data-maximo="${descuentoMaximo}">
            <section class="hoja">
                <h2>Cliente</h2>
                <div class="d-flex gap-2 align-items-end flex-wrap">
                    <div class="flex-grow-1">
                        <label class="form-label" for="clienteId">Cliente</label>
                        <select id="clienteId" name="clienteId" class="form-select" required>
                            <option value="">Elige un cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}" th:selected="${c.id == clienteId}"
                                    th:text="${c.razonSocial} + ' · ' + ${c.tipoDoc} + ' ' + ${c.numDoc}">cliente</option>
                        </select>
                    </div>
                    <a th:href="@{/clientes}" class="btn btn-outline-secondary">Registrar cliente nuevo</a>
                </div>
            </section>

            <section class="hoja">
                <h2>Productos y servicios</h2>
                <div class="table-responsive">
                <table class="table tabla-items" id="items">
                    <thead><tr><th style="min-width:260px">Producto o servicio</th><th style="width:90px">Cant.</th><th>Medidas</th><th style="width:130px">Precio S/</th><th style="width:100px">Desc. %</th><th class="num" style="width:120px">Subtotal</th><th></th></tr></thead>
                    <tbody>
                    <tr class="item">
                        <td class="col-producto" data-label="Producto o servicio"><select name="productoId" class="form-select producto" aria-label="Producto">
                            <option value="">Elige</option>
                            <option th:each="p : ${productos}" th:value="${p.id}" th:attr="data-precio=${p.precioUnitario},data-unidad=${p.unidadSunat},data-simbolo=${p.unidadSimbolo}"
                                    th:text="${p.descripcion} + ' (' + ${p.unidadSimbolo} + ')'">producto</option>
                        </select></td>
                        <td data-label="Cantidad"><input name="cantidad" type="number" min="1" value="1" class="form-control cantidad" aria-label="Cantidad"></td>
                        <td data-label="Medidas"><input name="medidas" class="form-control medidas" placeholder="Opcional" aria-label="Medidas">
                            <div class="form-text metrado"></div></td>
                        <td data-label="Precio S/"><input name="precio" type="number" min="0" step="0.01" class="form-control precio" aria-label="Precio"></td>
                        <td data-label="Desc. %"><input name="descuento" type="number" min="0" th:max="${descuentoMaximo}" step="0.5" placeholder="0"
                                   class="form-control descuento" aria-label="Descuento del ítem en porcentaje"></td>
                        <td class="num subtotal" data-label="Subtotal">0.00</td>
                        <td class="col-quitar"><button type="button" class="btn btn-sm btn-outline-secondary quitar" aria-label="Quitar ítem">Quitar</button></td>
                    </tr>
                    </tbody>
                </table>
                </div>
                <button type="button" class="btn btn-outline-secondary" id="agregar">Agregar ítem</button>
                <table class="ms-auto mt-3 resumen-cotizacion">
                    <tr><td>Subtotal de ítems</td><td></td><td class="num" id="subtotalItems">0.00</td></tr>
                    <tr><td><label for="descuentoGlobal">Descuento global</label></td>
                        <td><div class="input-group input-group-sm">
                            <input id="descuentoGlobal" name="descuentoGlobal" type="number" min="0" th:max="${descuentoMaximo}"
                                   step="0.5" placeholder="0" class="form-control text-end">
                            <span class="input-group-text">%</span></div></td>
                        <td class="num text-danger" id="montoDescuento">0.00</td></tr>
                    <tr class="fw-semibold"><td>Total S/</td><td></td><td class="num" id="total">0.00</td></tr>
                    <tr class="text-secondary small"><td>Op. gravada</td><td></td><td class="num" id="gravada">0.00</td></tr>
                    <tr class="text-secondary small"><td>IGV 18 %</td><td></td><td class="num" id="igv">0.00</td></tr>
                    <tr><td colspan="3" class="small" id="avisoDescuento" aria-live="polite"></td></tr>
                </table>
            </section>
            <button class="btn btn-principal">Guardar cotización</button>
            <a th:href="@{/cotizaciones}" class="btn btn-link">Cancelar</a>
        </form>
    </main>
</div>
<!-- th:inline="none": Thymeleaf no debe interpretar [[...]] dentro del JavaScript -->
<script th:inline="none">
    // Calcula subtotales y totales en pantalla; el servidor vuelve a calcularlos al guardar (clase Metrado).
    // Productos en metro (MTR), metro cuadrado (MTK) o metro cúbico (MTQ) de la Tabla 6 de SUNAT:
    // subtotal = precio x cantidad x metrado. Otras unidades: precio x cantidad.
    const DIMENSIONES = { MTR: 1, MTK: 2, MTQ: 3 };
    const AYUDA = {
        1: 'Longitud en metros, ej. 4.5',
        2: 'Área (ej. 5) o largo x alto, ej. 3.20 x 0.90',
        3: 'Volumen (ej. 2) o largo x ancho x alto'
    };

    function unidadDe(fila) {
        const op = fila.querySelector('.producto').selectedOptions[0];
        return ((op && op.dataset.unidad) || '').trim().toUpperCase();
    }
    function simboloDe(fila) {
        const op = fila.querySelector('.producto').selectedOptions[0];
        return (op && op.dataset.simbolo) || '';
    }

    // Devuelve el metrado (número > 0), 1 si la unidad no se cobra por medida, o null si las medidas no son válidas
    function metrado(unidad, texto) {
        const dims = DIMENSIONES[unidad] || 0;
        if (!dims) return 1;
        const nums = (texto || '').toLowerCase().replace(/m[23²³]/g, ' ')
            .match(/\d+(?:[.,]\d+)?/g) || [];
        if (!nums.length || (nums.length !== 1 && nums.length !== dims)) return null;
        const r = nums.map(n => parseFloat(n.replace(',', '.'))).reduce((a, b) => a * b, 1);
        return r > 0 ? r : null;
    }
    const tabla = document.querySelector('#items tbody');
    const plantilla = tabla.querySelector('.item').cloneNode(true);
    const fmt = n => n.toLocaleString('es-PE', {minimumFractionDigits: 2, maximumFractionDigits: 2});

    const MAXIMO = parseFloat(document.getElementById('formCotizacion').dataset.maximo) || 0;
    const pct = el => Math.min(Math.max(parseFloat(el.value) || 0, 0), 100);
    const redondear = n => Math.round(n * 100) / 100;

    function recalcular() {
        let total = 0;
        let bruto = 0;
        tabla.querySelectorAll('.item').forEach(fila => {
            const cant = parseFloat(fila.querySelector('.cantidad').value) || 0;
            const precio = parseFloat(fila.querySelector('.precio').value) || 0;
            const unidad = unidadDe(fila);
            const medidas = fila.querySelector('.medidas');
            const aviso = fila.querySelector('.metrado');
            const dims = DIMENSIONES[unidad] || 0;
            const m = metrado(unidad, medidas.value);
            medidas.placeholder = dims ? AYUDA[dims] : 'Opcional';
            medidas.required = dims > 0;
            medidas.classList.toggle('is-invalid', dims > 0 && medidas.value !== '' && m === null);
            aviso.textContent = dims && m !== null ? '= ' + fmt(m) + ' ' + simboloDe(fila) + ' por unidad' : '';
            const sinDescuento = redondear(cant * precio * (m === null ? 0 : m));
            const desc = fila.querySelector('.descuento');
            desc.classList.toggle('is-invalid', pct(desc) > MAXIMO);
            const sub = redondear(sinDescuento * (1 - pct(desc) / 100));
            fila.querySelector('.subtotal').textContent = fmt(sub);
            bruto += sinDescuento;
            total += sub;
        });
        // Descuento global sobre la suma de ítems (el servidor repite el cálculo al guardar)
        const global = document.getElementById('descuentoGlobal');
        global.classList.toggle('is-invalid', pct(global) > MAXIMO);
        const final = redondear(total * (1 - pct(global) / 100));
        document.getElementById('subtotalItems').textContent = fmt(total);
        document.getElementById('montoDescuento').textContent = (final < total ? '- ' : '') + fmt(total - final);
        const gravada = final / 1.18;
        document.getElementById('gravada').textContent = fmt(gravada);
        document.getElementById('igv').textContent = fmt(final - gravada);
        document.getElementById('total').textContent = fmt(final);
        // Descuento total efectivo (ítems + global) frente al máximo del rol
        const efectivo = bruto > 0 ? (1 - final / bruto) * 100 : 0;
        const aviso = document.getElementById('avisoDescuento');
        aviso.textContent = efectivo > 0.004 ? 'Descuento total: ' + fmt(efectivo) + ' % (máximo ' + MAXIMO + ' %)' : '';
        aviso.className = 'small ' + (efectivo > MAXIMO + 0.004 ? 'text-danger' : 'text-secondary');
    }

    document.getElementById('descuentoGlobal').addEventListener('input', recalcular);

    tabla.addEventListener('change', e => {
        if (e.target.classList.contains('producto')) {
            const op = e.target.selectedOptions[0];
            e.target.closest('.item').querySelector('.precio').value = op.dataset.precio || '';
        }
        recalcular();
    });
    tabla.addEventListener('input', recalcular);
    tabla.addEventListener('click', e => {
        if (e.target.classList.contains('quitar') && tabla.querySelectorAll('.item').length > 1) {
            e.target.closest('.item').remove();
            recalcular();
        }
    });
    document.getElementById('agregar').addEventListener('click', () => {
        tabla.appendChild(plantilla.cloneNode(true));
        recalcular();
    });
</script>
</body>
</html>
