<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productos y servicios')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="encabezado">
            <div><h1>Productos y servicios</h1><p>Precios de venta con IGV incluido.</p></div>
            <div class="btn-group" role="group" aria-label="Filtrar por tipo">
                <a th:href="@{/productos}" class="btn btn-outline-secondary" th:classappend="${tipoFiltro == null} ? 'active'">Todos</a>
                <a th:href="@{/productos(tipo='PRODUCTO')}" class="btn btn-outline-secondary" th:classappend="${tipoFiltro?.name() == 'PRODUCTO'} ? 'active'">Productos</a>
                <a th:href="@{/productos(tipo='SERVICIO')}" class="btn btn-outline-secondary" th:classappend="${tipoFiltro?.name() == 'SERVICIO'} ? 'active'">Servicios</a>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-lg-7">
                <section class="hoja">
                    <table class="table">
                        <thead><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th class="num">Precio S/</th><th sec:authorize="hasRole('ADMIN')"></th></tr></thead>
                        <tbody>
                        <tr th:each="p : ${productos}">
                            <td th:text="${p.codigo}">cod</td>
                            <td th:text="${p.descripcion}">desc</td>
                            <td th:text="${p.unidad}">und</td>
                            <td class="num" th:text="${#numbers.formatDecimal(p.precioUnitario, 1, 'COMMA', 2, 'POINT')}">0</td>
                            <td sec:authorize="hasRole('ADMIN')" class="text-end">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/productos(editar=${p.id})}">Editar</a></td>
                        </tr>
                        </tbody>
                    </table>
                </section>
            </div>
            <div class="col-lg-5" sec:authorize="hasRole('ADMIN')">
                <form class="hoja" th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
                    <h2 th:text="*{id} == null ? 'Nuevo producto o servicio' : 'Editar producto'">Nuevo</h2>
                    <input type="hidden" th:field="*{id}">
                    <div class="row g-2 mb-3">
                        <div class="col-6"><label class="form-label" for="codigo">Código</label>
                            <input th:field="*{codigo}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{codigo}"></div></div>
                        <div class="col-6"><label class="form-label" for="tipo">Tipo</label>
                            <select th:field="*{tipo}" class="form-select">
                                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">tipo</option>
                            </select></div>
                    </div>
                    <div class="mb-3"><label class="form-label" for="descripcion">Descripción</label>
                        <input th:field="*{descripcion}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{descripcion}"></div></div>
                    <div class="row g-2 mb-4">
                        <div class="col-5"><label class="form-label" for="unidad">Unidad</label>
                            <input th:field="*{unidad}" class="form-control" placeholder="UND, M, M2" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{unidad}"></div></div>
                        <div class="col-7"><label class="form-label" for="precioUnitario">Precio con IGV (S/)</label>
                            <input th:field="*{precioUnitario}" type="number" step="0.01" min="0" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{precioUnitario}"></div></div>
                    </div>
                    <button class="btn btn-principal">Guardar</button>
                    <a th:if="*{id} != null" th:href="@{/productos}" class="btn btn-link">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
