<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productos y servicios')}"></head>
<body>
<div class="app">
    <nav th:replace="~{fragments/layout :: menu}"></nav>
    <main class="contenido">
        <div th:replace="~{fragments/layout :: mensajes}"></div>
        <div class="encabezado">
            <div><h1>Productos y servicios</h1><p>Precios de venta con IGV incluido. Busca y ordena con un clic en cada columna.</p></div>
            <div class="d-flex flex-wrap gap-2">
                <div class="btn-group" role="group" aria-label="Filtrar por tipo">
                    <a th:href="@{/productos}" class="btn btn-outline-secondary" th:classappend="${tipoFiltro == null} ? 'active'">Todos</a>
                    <a th:href="@{/productos(tipo='PRODUCTO')}" class="btn btn-outline-secondary" th:classappend="${tipoFiltro?.name() == 'PRODUCTO'} ? 'active'">Productos</a>
                    <a th:href="@{/productos(tipo='SERVICIO')}" class="btn btn-outline-secondary" th:classappend="${tipoFiltro?.name() == 'SERVICIO'} ? 'active'">Servicios</a>
                </div>
                <button sec:authorize="hasRole('ADMIN')" type="button" class="btn btn-principal" id="btnNuevoProducto">Nuevo producto o servicio</button>
            </div>
        </div>

        <section class="hoja">
            <p th:if="${#lists.isEmpty(productos)}" class="text-secondary m-0">No hay productos ni servicios registrados.</p>
            <table th:unless="${#lists.isEmpty(productos)}" class="table" id="tablaProductos">
                <thead><tr><th data-priority="4">Código</th><th data-priority="1">Descripción</th><th data-priority="5">Tipo</th><th data-priority="6">Unidad</th><th data-priority="2" class="num">Precio S/</th><th data-priority="3" sec:authorize="hasRole('ADMIN')" class="sin-orden"></th></tr></thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.codigo}">cod</td>
                    <td th:text="${p.descripcion}">desc</td>
                    <td th:text="${p.tipo?.name() == 'SERVICIO'} ? 'Servicio' : 'Producto'">tipo</td>
                    <td th:text="${p.unidad}">und</td>
                    <td class="num" th:data-order="${p.precioUnitario}"
                        th:text="${#numbers.formatDecimal(p.precioUnitario, 1, 'COMMA', 2, 'POINT')}">0</td>
                    <td sec:authorize="hasRole('ADMIN')" class="text-end">
                        <!-- Los datos viajan en atributos data-*; el script los copia al formulario de la ventana -->
                        <a class="btn btn-sm btn-outline-secondary btn-editar-producto" th:href="@{/productos(editar=${p.id})}"
                           th:data-id="${p.id}" th:data-codigo="${p.codigo}" th:data-tipo="${p.tipo}"
                           th:data-descripcion="${p.descripcion}" th:data-unidad="${p.unidad}"
                           th:data-precio-unitario="${p.precioUnitario}">Editar</a></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<!-- Ventana emergente para registrar o editar un producto o servicio (solo administrador) -->
<div sec:authorize="hasRole('ADMIN')" class="modal fade" id="modalProducto" tabindex="-1"
     aria-labelledby="tituloModalProducto" aria-hidden="true" th:data-abrir="${abrirFormulario}">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" id="formProducto" th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="tituloModalProducto"
                    th:text="*{id} == null ? 'Nuevo producto o servicio' : 'Editar producto o servicio'">Nuevo producto o servicio</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}">error</div>
                <input type="hidden" th:field="*{id}">
                <div class="row g-2 mb-3">
                    <div class="col-6"><label class="form-label" for="tipo">Tipo <span class="obligatorio">*</span></label>
                        <select th:field="*{tipo}" class="form-select" th:errorclass="is-invalid">
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">tipo</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipo}"></div></div>
                    <div class="col-6"><label class="form-label" for="codigo">Código</label>
                        <!-- Solo lectura: el servidor asigna el código definitivo al guardar -->
                        <input th:field="*{codigo}" class="form-control bg-body-tertiary" readonly tabindex="-1"
                               aria-describedby="ayudaCodigo">
                        <div class="form-text" id="ayudaCodigo">Se asigna automáticamente.</div></div>
                </div>
                <!-- Siguiente código de cada tipo, calculado en el servidor (PRD-006, SRV-003...) -->
                <input type="hidden" class="codigo-siguiente" th:each="e : ${siguientesCodigos}"
                       th:data-tipo="${e.key}" th:value="${e.value}">
                <div class="mb-3"><label class="form-label" for="descripcion">Descripción <span class="obligatorio">*</span></label>
                    <input th:field="*{descripcion}" class="form-control" maxlength="200" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{descripcion}"></div></div>
                <div class="row g-2">
                    <div class="col-5"><label class="form-label" for="unidad">Unidad <span class="obligatorio">*</span></label>
                        <input th:field="*{unidad}" class="form-control" placeholder="UND, M, M2" maxlength="10" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{unidad}"></div></div>
                    <div class="col-7"><label class="form-label" for="precioUnitario">Precio con IGV (S/) <span class="obligatorio">*</span></label>
                        <input th:field="*{precioUnitario}" type="number" step="0.01" min="0" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{precioUnitario}"></div></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-principal" id="btnGuardarProducto"
                        th:text="*{id} == null ? 'Guardar' : 'Actualizar'">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- th:inline="none": Thymeleaf no debe interpretar [[...]] dentro del JavaScript -->
<script th:inline="none">
    // Nuevo: ventana vacía. Editar: ventana con los datos de la fila, sin recargar la página.
    document.addEventListener('DOMContentLoaded', function () {
        cruzmaTabla('#tablaProductos', { order: [ [1, 'asc'] ] });   // ordenado por descripción; todos los roles

        var modalEl = document.getElementById('modalProducto');
        if (!modalEl) return;                     // vendedor y caja solo consultan el catálogo
        var modal = new bootstrap.Modal(modalEl);
        var form = document.getElementById('formProducto');
        var campos = ['id', 'codigo', 'tipo', 'descripcion', 'unidad', 'precioUnitario'];
        var siguientes = {};
        form.querySelectorAll('.codigo-siguiente').forEach(function (el) { siguientes[el.dataset.tipo] = el.value; });

        var original = null;   // tipo y código del ítem que se está editando

        // El código mostrado sigue al tipo: PRODUCTO → PRD-..., SERVICIO → SRV-...
        // Al editar se conserva el código, salvo que se cambie el tipo (entonces toma el siguiente del nuevo tipo).
        function actualizarCodigo() {
            var tipo = form.elements['tipo'].value;
            form.elements['codigo'].value = (original && original.tipo === tipo) ? original.codigo : (siguientes[tipo] || '');
        }
        form.elements['tipo'].addEventListener('change', actualizarCodigo);

        function limpiarErrores() {
            form.querySelectorAll('.is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });
            form.querySelectorAll('.alert-danger').forEach(function (el) { el.remove(); });
        }

        function abrir(datos) {
            limpiarErrores();
            campos.forEach(function (c) {
                var el = form.elements[c];
                if (el) el.value = datos[c] || (c === 'tipo' ? el.options[0].value : '');
            });
            var nuevo = !datos.id;
            original = nuevo ? null : { tipo: datos.tipo, codigo: datos.codigo };
            actualizarCodigo();
            document.getElementById('tituloModalProducto').textContent =
                nuevo ? 'Nuevo producto o servicio' : 'Editar producto o servicio';
            document.getElementById('btnGuardarProducto').textContent = nuevo ? 'Guardar' : 'Actualizar';
            modal.show();
        }

        document.getElementById('btnNuevoProducto').addEventListener('click', function () { abrir({}); });

        // Un solo escuchador para toda la tabla: sigue funcionando en todas las páginas de DataTables
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.btn-editar-producto');
            if (!btn) return;
            e.preventDefault();                   // sin JavaScript, el enlace /productos?editar=ID sigue funcionando
            abrir(btn.dataset);                   // data-precio-unitario llega como dataset.precioUnitario
        });

        // La unidad se guarda en mayúsculas (und → UND)
        form.elements['unidad'].addEventListener('input', function (e) { e.target.value = e.target.value.toUpperCase(); });

        modalEl.addEventListener('shown.bs.modal', function () { form.elements['descripcion'].focus(); });

        // Al volver del servidor con errores (o con ?editar=ID), la ventana se abre sola
        if (modalEl.dataset.abrir === 'true') {
            if (form.elements['id'].value) original = { tipo: form.elements['tipo'].value, codigo: form.elements['codigo'].value };
            actualizarCodigo();
            modal.show();
        }
    });
</script>
</body>
</html>
