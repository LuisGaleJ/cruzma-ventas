<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1f272e">
    <title>Sin conexión · Cruzma Ventas</title>
    <link rel="icon" href="/img/favicon-32.png">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1f272e;
               font-family: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif; color: #1f272e; }
        main { background: #fff; border-radius: 6px; padding: 32px; width: min(380px, 88vw); text-align: center; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 20px; font-weight: 600; margin: 16px 0 8px; }
        p { color: #6b7882; margin: 0 0 20px; line-height: 1.5; }
        button { background: #1d5b79; color: #fff; border: 0; border-radius: 6px; padding: 10px 20px; font-size: 15px; }
    </style>
</head>
<body>
<main>
    <img src="/img/icono-192.png" alt="">
    <h1>Sin conexión a internet</h1>
    <p>Cruzma Ventas necesita internet para consultar y registrar cotizaciones, ventas y comprobantes.
       Revisa tu conexión e inténtalo otra vez.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
