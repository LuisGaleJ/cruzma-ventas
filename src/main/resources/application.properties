spring.application.name=cruzma-ventas
# Puerto: las plataformas en la nube lo asignan con PORT (en Azure se usa SERVER_PORT=80)
server.port=${PORT:8080}
# Detras del proxy HTTPS de la nube: respeta X-Forwarded-Proto para que las redirecciones usen https
server.forward-headers-strategy=framework

# Perfil por defecto: H2 en memoria (no requiere instalar MySQL)
spring.datasource.url=jdbc:h2:mem:cruzma;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.open-in-view=true

# Configuracion del proveedor de facturacion electronica (OSE/PSE)
# simulado (por defecto, sin internet) o nubefact (API real; RUTA y TOKEN de la cuenta en variables de entorno)
cruzma.ose.proveedor=${OSE_PROVEEDOR:simulado}
cruzma.ose.url=${OSE_URL:https://demo-ose.example/api}
cruzma.ose.token=${OSE_TOKEN:token-de-pruebas}
# Series en Nubefact: FFF1 y BBB1 son las de la cuenta de demostracion; en produccion, las series reales (F001, B001...)
cruzma.ose.serie-factura=${OSE_SERIE_FACTURA:FFF1}
cruzma.ose.serie-boleta=${OSE_SERIE_BOLETA:BBB1}
cruzma.ose.serie-nota-factura=${OSE_SERIE_NOTA_FACTURA:FFF1}
cruzma.ose.serie-nota-boleta=${OSE_SERIE_NOTA_BOLETA:BBB1}
cruzma.igv=0.18

# Consulta de DNI (RENIEC) y RUC (SUNAT) para autocompletar clientes: API de Decolecta.
# El token se genera en https://decolecta.com/profile y se guarda en la variable de entorno DECOLECTA_TOKEN.
cruzma.consulta.url=${DECOLECTA_URL:https://api.decolecta.com}
cruzma.consulta.token=${DECOLECTA_TOKEN:}
cruzma.consulta.ruta-dni=/v1/reniec/dni
cruzma.consulta.ruta-ruc=/v1/sunat/ruc

# Datos de la empresa que aparecen en cotizaciones y comprobantes (tildes como \u00e1 \u00e9 \u00ed \u00f3 \u00fa)
cruzma.empresa.ruc=20612410390
cruzma.empresa.nombre=Grupo Cruzma
cruzma.empresa.direccion=Piura, Per\u00fa

# Seguridad de la sesion (APF3)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# CRUZMA_PUBLICO=true cuando el sistema esta en internet: cookie solo por HTTPS y clave inicial obligatoria
cruzma.publico=${CRUZMA_PUBLICO:false}
server.servlet.session.cookie.secure=${CRUZMA_PUBLICO:false}

# Datos iniciales (solo si la base no tiene roles): clave inicial de los usuarios y datos de ejemplo
cruzma.inicial.password=${ADMIN_PASSWORD:Cruzma2026}
cruzma.demo.datos=${DEMO_DATOS:true}
server.error.include-stacktrace=never
cruzma.login.max-intentos=5
cruzma.login.minutos-bloqueo=15

# Auditoria de datos con Hibernate Envers: tablas <tabla>_aud + revinfo (quien y cuando)
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Cotizaciones: con cuantos dias de anticipacion se avisa que una cotizacion esta por vencer (0 a 15)
cruzma.cotizacion.dias-aviso=${COTIZACION_DIAS_AVISO:3}
