spring.application.name=cruzma-ventas
server.port=8080

# Perfil por defecto: H2 en memoria (no requiere instalar MySQL)
spring.datasource.url=jdbc:h2:mem:cruzma;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.open-in-view=true

# Configuracion del proveedor de facturacion electronica (OSE/PSE)
cruzma.ose.url=${OSE_URL:https://demo-ose.example/api}
cruzma.ose.token=${OSE_TOKEN:token-de-pruebas}
cruzma.igv=0.18

# Datos de la empresa que aparecen en cotizaciones y comprobantes (tildes como \u00e1 \u00e9 \u00ed \u00f3 \u00fa)
cruzma.empresa.ruc=20612410390
cruzma.empresa.nombre=Grupo Cruzma
cruzma.empresa.direccion=Piura, Per\u00fa

# Seguridad de la sesion (APF3)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-stacktrace=never
cruzma.login.max-intentos=5
cruzma.login.minutos-bloqueo=15

# Auditoria de datos con Hibernate Envers: tablas <tabla>_aud + revinfo (quien y cuando)
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
